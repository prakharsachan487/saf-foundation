<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Smooth high quality gradient definition -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="100%" stop-color="#C41912"/>
    </linearGradient>
  </defs>

  <g id="logo-mark" transform="translate(200, 200)">
    <!-- Base Circular Background -->
    <circle cx="0" cy="0" r="192" fill="#FFFFFF"/>
    
    <!-- Red Leaf / Crescent Right Element -->
    <path d="M 0,-192 C 85,-192 158,-125 186,-42 C 208,22 192,115 135,172 C 94,208 42,192 10,187 C 47,156 73,98 83,46 C 98,-32 73,-120 0,-192 Z" fill="url(#redGradient)"/>
    
    <!-- Red Swoosh Secondary Accent -->
    <path d="M 130,-78 C 166,-10 172,73 125,135 C 150,98 156,31 137,-36 C 127,-68 114,-98 88,-130 C 109,-109 123,-94 130,-78 Z" fill="#D01C14"/>

    <!-- Head Circle -->
    <circle cx="-54" cy="-80" r="44" fill="#181818"/>
    
    <!-- Black Body and Reaching Arm Curves -->
    <path d="M -85,-182 C -32,-177 32,-146 80,-98 C 135,-42 130,21 83,88 C 36,156 -58,192 -120,166 C -172,140 -192,83 -192,15 C -192,-88 -150,-161 -85,-182 Z 
             M -32,-32 C 5,-21 32,10 21,47 C 10,83 -32,120 -78,114 C -125,109 -150,68 -145,21 C -140,-26 -83,-42 -32,-32 Z" 
          fill="#181818" fill-rule="evenodd"/>

    <!-- Left Outer Silhouette Curve -->
    <path d="M -52,-187 C -150,-156 -198,-62 -192,36 C -187,125 -120,192 -21,192 C 16,192 62,172 98,140 C 42,125 0,62 -5,0 C -10,-62 16,-120 68,-156 C 26,-182 -16,-192 -52,-187 Z" fill="#181818"/>
    
    <!-- Right Red Wing/Petal -->
    <path d="M 70,-154 C 140,-98 192,-10 192,68 C 192,120 161,166 109,187 C 140,151 156,94 145,36 C 135,-32 104,-104 70,-154 Z" fill="url(#redGradient)"/>
    
    <!-- Central Head circle -->
    <circle cx="-54" cy="-81" r="42" fill="#181818"/>
    
    <!-- White Dynamic Swoosh ribbon cutting through -->
    <path d="M -78,-172 C 21,-114 98,10 68,151 C 47,114 52,21 -16,-73 C -47,-114 -78,-146 -78,-172 Z" fill="#FFFFFF"/>
    <path d="M 5,187 C 47,156 75,94 71,31 C 68,-21 42,-78 0,-125 C 36,-73 57,-16 52,47 C 47,104 26,151 5,187 Z" fill="#FFFFFF"/>
  </g>
</svg>
