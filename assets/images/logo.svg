<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Smooth shadows & gradient definition -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="logo-mark" transform="translate(250, 210)">
    <!-- Base Circular Background -->
    <circle cx="0" cy="0" r="185" fill="#FFFFFF"/>
    
    <!-- Red Leaf / Crescent Right Element -->
    <!-- Rich dynamic vibrant red shape -->
    <path d="M 0,-185 C 80,-185 150,-120 178,-40 C 200,20 185,110 130,165 C 90,200 40,185 10,180 C 45,150 70,95 80,45 C 95,-30 70,-115 0,-185 Z" fill="#E2231A"/>
    
    <!-- Red Swoosh Secondary Accent -->
    <path d="M 125,-75 C 160,-10 165,70 120,130 C 145,95 150,30 132,-35 C 122,-65 110,-95 85,-125 C 105,-105 118,-90 125,-75 Z" fill="#D01C14"/>

    <!-- Black Dynamic Human Figure & Left Crescent -->
    <!-- Head Circle -->
    <circle cx="-50" cy="-75" r="42" fill="#181818"/>
    
    <!-- Black Body and Reaching Arm Curves -->
    <path d="M -80,-175 C -30,-170 30,-140 75,-95 C 130,-40 125,20 80,85 C 35,150 -55,185 -115,160 C -165,135 -185,80 -185,15 C -185,-85 -145,-155 -80,-175 Z 
             M -30,-30 C 5,-20 30,10 20,45 C 10,80 -30,115 -75,110 C -120,105 -145,65 -140,20 C -135,-25 -80,-40 -30,-30 Z" 
          fill="#181818" fill-rule="evenodd"/>

    <!-- Clean stylized accurate path match for logo -->
    <path d="M -50,-180 C -145,-150 -190,-60 -185,35 C -180,120 -115,185 -20,185 C 15,185 60,165 95,135 C 40,120 0,60 -5,0 C -10,-60 15,-115 65,-150 C 25,-175 -15,-185 -50,-180 Z" fill="#181818"/>
    
    <!-- Right Red Wing/Petal -->
    <path d="M 68,-148 C 135,-95 185,-10 185,65 C 185,115 155,160 105,180 C 135,145 150,90 140,35 C 130,-30 100,-100 68,-148 Z" fill="#E2231A"/>
    
    <!-- Central Head circle -->
    <circle cx="-52" cy="-78" r="40" fill="#181818"/>
    
    <!-- White Dynamic Swoosh ribbon cutting through -->
    <path d="M -75,-165 C 20,-110 95,10 65,145 C 45,110 50,20 -15,-70 C -45,-110 -75,-140 -75,-165 Z" fill="#FFFFFF"/>
    <path d="M 5,180 C 45,150 72,90 68,30 C 65,-20 40,-75 0,-120 C 35,-70 55,-15 50,45 C 45,100 25,145 5,180 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography: S. A. FOUNDATION -->
  <text x="250" y="475" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', 'Georgia', serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#111111" 
        text-anchor="middle">S. A. FOUNDATION</text>
</svg>
